<!DOCTYPE html>
<html>
<head> <link rel="stylesheet" href="./CSS/index.css">
    <title>Report</title>
</head>
<body>

    <h2>Report</h2> 
    
    <div class="report-header">
        <label>From Date:</label>
        <input type="date" id="startDate">
        
        <label>To Date:</label>
        <input type="date" id="endDate">
        
        <button onclick="generateReport()">
            Generate Report
        </button>
    </div>
    
    <br>

    <table border="1" width="100%">
        <thead>
            <tr>
                <th>Date</th>
                <th>Head Name</th>
                <th>Type</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody id="reportTableBody">
            </tbody>
    </table>
        <div id="summaryDisplay"></div>
    <script src="../Scripts/report.js"></script>

    <script type="text/javascript">
        async function generateReport() {
            const start = document.getElementById("startDate").value;
            const end = document.getElementById("endDate").value;

            if (!start || !end) {
                alert("Please select both dates!");
                return;
            }

            const tableBody = document.getElementById("reportTableBody");
             const summaryDiv = document.getElementById("summaryDisplay");

            try {
                const data = await getTransactionReport(start, end);

                tableBody.innerHTML = "";
                summaryDiv.innerHTML = "";

                if (!data.transactions || data.transactions.length === 0) {
                        tableBody.innerHTML = "<tr><td>No data found for this range.</td></tr>";
                    return;
                }

                data.transactions.forEach(item => {
                  
                    const typeLabel = item.transactionType === 0 ? "Income" : "Expense";
                    tableBody.innerHTML += `
                        <tr>
                            <td>${new Date(item.transactionDate).toLocaleDateString()}</td>
                            <td>${item.headName}</td>
                            <td>${typeLabel}</td>
                            <td>${item.amount.toFixed(2)}</td>
                        </tr>`;
                });
                const netBalance = data.totalIncome - data.totalExpense;
           summaryDiv.innerHTML = `
                    <div class="summary">
                        <p>Total Income: <b>${data.totalIncome.toFixed(2)}</b></p>
                        <p>Total Expense: <b>${data.totalExpense.toFixed(2)}</b></p>
                        <hr>
                        <h3>Net Balance: ${netBalance.toFixed(2)}</h3>
                    </div>
                `;

            } catch (error) {
                console.error(error);
               
            }
        }
    </script>
</body>
</html>
