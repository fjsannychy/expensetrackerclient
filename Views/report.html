<!DOCTYPE html>
<html lang="en">
<head>
    <title>Expense Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<div class="container">
    <h2 class="mb-4">Financial Report</h2>

    <div class="row mb-4">
        <div class="col-md-3">
            <label>From:</label>
            <input type="date" id="startDate" class="form-control">
        </div>
        <div class="col-md-3">
            <label>To:</label>
            <input type="date" id="endDate" class="form-control">
        </div>
        <div class="col-md-2 align-self-end">
            <button class="btn btn-primary w-100" onclick="generateReport()">Show Report</button>
        </div>
    </div>

    <table class="table table-bordered">
        <thead class="table-secondary">
            <tr>
                <th>Date</th>
                <th>Head Name</th>
                <th>Type</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody id="reportTableBody">
            <tr><td colspan="4" class="text-center">No data loaded</td></tr>
        </tbody>
    </table>

    <div id="summaryDisplay" class="mt-4 p-3 border rounded bg-light" style="max-width: 300px; display: none;">
        </div>
</div>

<script src="../Scripts/report.js"></script>

<script>
    async function generateReport() {
        const start = document.getElementById("startDate").value;
        const end = document.getElementById("endDate").value;

        if (!start || !end) return alert("Select dates");

        const tableBody = document.getElementById("reportTableBody");
        const summaryDiv = document.getElementById("summaryDisplay");

        try {
            const data = await getTransactionReport(start, end);
            
            // Clear current view
            tableBody.innerHTML = "";
            summaryDiv.style.display = "block"; // Show the summary box

            if (!data.transactions || data.transactions.length === 0) {
                tableBody.innerHTML = "<tr><td colspan='4'>No data found</td></tr>";
                summaryDiv.style.display = "none";
                return;
            }

            // Fill Table
            data.transactions.forEach(item => {
                const type = item.transactionType === 0 ? "Income" : "Expense";
                const color = item.transactionType === 0 ? "text-success" : "text-danger";

                tableBody.innerHTML += `
                    <tr>
                        <td>${new Date(item.transactionDate).toLocaleDateString()}</td>
                        <td>${item.headName}</td>
                        <td class="${color} fw-bold">${type}</td>
                        <td>${item.amount.toFixed(2)}</td>
                    </tr>`;
            });

            // Show Totals
            const balance = data.totalIncome - data.totalExpense;
            summaryDiv.innerHTML = `
                <p>Total Income: <span class="text-success fw-bold">${data.totalIncome.toFixed(2)}</span></p>
                <p>Total Expense: <span class="text-danger fw-bold">${data.totalExpense.toFixed(2)}</span></p>
                <hr>
                <h5>Balance: ${balance.toFixed(2)}</h5>
            `;

        } catch (error) {
            console.error(error);
        }
    }
</script>

</body>
</html>
