<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Heads</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            
            <div class="card mb-4">
                <div class="card-body">
                    <h2 class="card-title mb-4">Manage Transaction Heads</h2>
                    <div class="input-group">
                        <input type="text" id="name" class="form-control">
                        <button class="btn btn-primary" onclick="SaveData()" id="saveBtn">Save Head</button>
                   
            </div>

            <div class="table-container shadow-sm">
                <h4 class="mb-3">Existing Heads</h4>
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 10%"></th>
                            <th>Name</th>
                            <th class="text-end" style="width: 30%">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable">
                        </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script type="text/javascript" src="../Scripts/heads.js"></script>

<script type="text/javascript">
    

    var editRow = false;
    var Id = 0;

    
    function loadData(){
        getAllHeads().then(resp => {
            let table = document.getElementById("dataTable");
            table.innerHTML = "";

            resp.map((td, i) => {
                table.innerHTML += `
                    <tr>
                        <td class="align-middle">${i + 1}</td>
                        <td class="align-middle fw-bold">${td.name}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-warning me-1" onclick="EditData(${td.id})">Edit</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="DeleteData(${td.id})">Delete</button>
                        </td>
                    </tr>`;
            });
        });
    }

    
    loadData();

    function SaveData() {
        const nameInput = document.getElementById("name");
        if(!nameInput.value){
            alert("Please enter a valid value in the field!");
            return;
        }

        if(!editRow) {
    
            createHead({ id: 0, name: nameInput.value })
            .then(resp => {
                if(resp){
                    loadData();
                    resetForm();
                }
            });
        } else {
            
            updateHead(Id, { id: Id, name: nameInput.value })
            .then(resp => {
                if(resp){
                    editRow = false; 
                    loadData();
                    resetForm();
                }
            });
        }
    }

    function DeleteData(id) {
        if(confirm("Are you sure you want to delete this head?")){
            deleteHead(id).then(resp => {
                loadData();
            });
        }
    }

    function EditData(id) {
        getHeadById(id).then(resp => {
            Id = resp.id;
            document.getElementById("name").value = resp.name;
            editRow = true;
            document.getElementById("saveBtn").className = "btn btn-warning";
            document.getElementById("saveBtn").innerText = "Update Head";
        });
    }

    function resetForm() {
        document.getElementById("name").value = "";
        document.getElementById("saveBtn").className = "btn btn-primary";
        document.getElementById("saveBtn").innerText = "Save Head";
        editRow = false;
    }

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
